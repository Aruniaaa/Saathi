<!DOCTYPE html>
{% load static %}
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Saathi - Contact Us</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<style type="text/css">
    .material-icons {
      font-family: 'Material Icons';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
  </style>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#fe7474",
            "background-light": "#f0f2f5",
            "background-dark": "#0D0F14",
            'accent-1': '#c7b7ff',
            'secondary': '#ffa8a8',
            'text-main-light': '#1e293b',
            'text-main-dark': '#ffffff',
            'text-secondary-light': '#64748b',
            'text-secondary-dark': '#94a3b8',
            'card-light': '#ffffff',
            'card-dark': '#1e1b24',
          },
          fontFamily: {
            display: ["Space Grotesk", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "0.75rem",
          },
        },
      },
    };
  </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-main-light dark:text-main-dark">
<div class="flex flex-col min-h-screen">
<header class="w-full px-8 py-6">
  <nav class="container mx-auto flex justify-between items-center relative">
    <div class="flex items-center gap-4">
      <a class="flex items-center gap-3" href="{% url 'home' %}">
        <img src="{% static 'flower.png' %}" class="h-10 w-10" />
        <span class="text-2xl font-bold text-text-main-light dark:text-text-main-dark">Saathi</span>
      </a>
    </div>
    
    <div class="hidden md:flex items-center space-x-8 text-text-secondary-light dark:text-text-secondary-dark absolute left-1/2 transform -translate-x-1/2">
      <a class="hover:text-primary transition-colors" href="{% url 'chat' %}">Chat</a>
      <a class="hover:text-primary transition-colors" href="{% url 'quiz_gen' %}">Make a Quiz</a>
      <a class="hover:text-primary transition-colors" href="{% url 'progress' %}">Progress</a>
    </div>
    
    <div class="flex items-center space-x-8 text-text-secondary-light dark:text-text-secondary-dark">
      <a class="font-medium text-text-main-light dark:text-text-main-dark hover:text-primary transition-colors" href="{% url 'home' %}">Home</a>
    </div>
  </nav>
</header>
<main class="flex-grow flex items-center justify-center py-12 px-4">
<div class="w-full max-w-2xl text-center">
<h1 class="text-5xl font-bold mb-4 text-text-main-light dark:text-text-main-dark">Contact Us</h1>
<p class="text-lg text-text-secondary-light dark:text-text-secondary-dark mb-12 max-w-md mx-auto">We're here to help. Reach out to the developer through your preferred channel.</p>
<div class="space-y-4">
<a class="group flex items-center p-6 bg-card-light dark:bg-card-dark rounded-lg shadow-sm hover:shadow-md transition-all duration-300" href="mailto:charulabs@gmail.com">
<div class="mr-6 text-text-secondary-light dark:text-text-secondary-dark">
<span class="material-icons">email</span>
</div>
<div class="text-left flex-grow">
<p class="font-bold text-lg text-text-main-light dark:text-text-main-dark">Email</p>
<p class="text-text-secondary-light dark:text-text-secondary-dark">charulabs@gmail.com</p>
</div>
<div class="text-text-secondary-light dark:text-text-secondary-dark group-hover:translate-x-1 transition-transform">
<span class="material-icons">arrow_forward</span>
</div>
</a>
<a class="group flex items-center p-6 bg-card-light dark:bg-card-dark rounded-lg shadow-sm hover:shadow-md transition-all duration-300" href="https://github.com/Aruniaaa">
<div class="mr-6 text-text-secondary-light dark:text-text-secondary-dark">

</div>
<div class="text-left flex-grow">
<p class="font-bold text-lg text-text-main-light dark:text-text-main-dark">GitHub</p>
<p class="text-text-secondary-light dark:text-text-secondary-dark">Aruniaaa</p>
</div>
<div class="text-text-secondary-light dark:text-text-secondary-dark group-hover:translate-x-1 transition-transform">
<span class="material-icons">arrow_forward</span>
</div>
</a>
</a>
</div>
</div>
</main>
</div>

</body></html>
